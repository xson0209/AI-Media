                - generic [ref=f2e157]: "Create a 8-second 9:16 live-action product video clip. This is clip 1 of 8 of a 64-second product video covering timeline 0-8s. Product reference: use the attached product image (Flow Ingredients / References to Video) as the single source of truth for the product's shape, colour and label. Segment structure: build 3 connected micro-scenes inside this one clip, all serving one primary visual action. Hook for the first 0-2 seconds: Nước vừa rót đã ấm? Nhìn combo này trước khi bạn ra đường! Video language: Vietnamese Aspect ratio: 9:16 Clip length: 8 seconds Timeline position: 0-8s Beat role: hook Shot type: hero shot Camera angle: Ngang tầm ngực, hơi chếch lên để sản phẩm nổi bật giữa dòng người. Framing: medium close-up Composition: Video dọc 9:16, dùng đúng ảnh sản phẩm người dùng đính kèm trong Flow; một bàn tay nâng bình vào giữa khung ở độ cao ngực, giữ nhãn trước vuông góc với camera. Camera movement: Điện thoại cầm tay rung nhẹ tự nhiên, trôi rất nhỏ sang trái rồi chỉnh lại để bình luôn ở trung tâm. Subject motion: Bàn tay nâng sản phẩm từ dưới khung lên, dừng ở ngực và siết nhẹ để giữ bình ổn định. Environment motion: Xe máy chạy ngang phía sau, người đi bộ lướt qua và một người bán hàng di chuyển ở khoảng cách trung bình. Lighting: Ánh nắng cuối chiều ấm, phản sáng nhẹ trên thân bình nhưng vẫn giữ rõ màu và chi tiết nhãn. Mood: Gần gũi, gây tò mò và chạm đúng nỗi khó chịu khi mang nước ra đường. Visual style: Handheld vertical UGC look, shot on a phone, single continuous take. A hand raises the product into frame at chest height and holds it steady with the front label square to camera. Camera: handheld with slight natural shake, a small drift to keep the product centered, no zoom. Environment: a busy street in late afternoon — passing motorbikes, a vendor moving in the middle distance, foot traffic. B Narration: Bình nước của bạn hay nóng nhanh, đổ mồ hôi và bất tiện mỗi lần ra đường không? Retention notes: Đưa ngay 