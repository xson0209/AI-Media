                          - paragraph: Chiến lược kịch bản
                          - paragraph: Bản tiếng Việt để duyệt; nếu video cuối là Tiếng Việt, phần sản xuất vẫn theo ngôn ngữ video.
                          - generic: "Bản tiếng Việt: Tập mở đầu dùng cấu trúc short quốc tế: hook cực nhanh bằng hình ảnh căn nhà gần sập giữa mưa, sau đó đặt câu hỏi: tại sao Nam lại chọn bước vào nơi này? Xung đột chính là Nam cần một mái nhà nhưng căn nhà quá tồi tàn, nguy hiểm và có vẻ đang che giấu điều gì đó. Emotional arc đi từ hài hước, sợ hãi, thất vọng sang kiên trì và hy vọng. Mỗi segment có một phát hiện mới: cửa bung, mái dột, sàn gãy, ảnh cũ, hộp bí mật, rồi ánh đèn ấm đầu tiên. Payoff cuối là Nam không có một căn nhà hoàn hảo, nhưng có một nơi để bắt đầu. Câu kết mềm mở ra tập sau bằng dấu hiệu bí ẩn trong hộp gỗ. Bản tiếng Anh dùng cho video: Episode 1 opens with a fast global-short hook: a nearly collapsing house in the rain, and Nam stepping toward it anyway. The core conflict is simple and visual: Nam needs shelter, but the house is broken, unsafe, and hiding a secret. The emotional arc moves from humor and fear to frustration, persistence, and quiet hope. Each segment reveals a new problem or clue: the broken door, leaking roof, weak floor, old photo, hidden box, and finally the first warm light inside the house. The payoff is not a perfect home, but a beginning. The soft ending invites the next episode through a small mystery hidden under the floorboards."
                        - generic:
                          - paragraph: Ghi chú nhất quán
                          - paragraph: Bản tiếng Việt giúp kiểm tra nhân vật, bối cảnh, phong cách và tính nhất quán.
                          - generic: "Bản tiếng Việt: Giữ Nam là nhân vật duy nhất nổi bật trong tập: cơ thể người que màu xám than #6A6A6A, đầu tròn lớn hơn bình thường 15%, mắt trắng lớn biểu cảm, không tóc, không mũi, không tai, miệng là nét cong đơn giản, có vết nứt trắng nhỏ bên trái đầu. Trang phục xuyên suốt: hoodie xanh navy, quần short đen, sneaker trắng, khăn quàng vàng; sau khi vào nhà có thể dính bụi, nước mưa và vết bẩn nhưng không được đổi thiết kế. Căn nhà là nhà gỗ/cũ ở rìa thị trấn, mái dột, tường nứt, sàn ọp ẹp, cửa lệch bản lề, đồ vật phủ bụi nhưng có tỷ lệ thật. Phong cách hình ảnh là cinematic 3D animation chất lượng cao, ánh sáng tự nhiên, volumetric rain/fog/dust, camera luôn có chuyển động mượt như dolly, handheld, orbit, crane. Không có chữ trên màn hình, không logo, không watermark. Tập kết thúc trong cùng căn nhà, sau khi Nam tạo được một góc nhỏ có ánh sáng ấm và tìm thấy hộp gỗ bí ẩn. Bản tiếng Anh dùng cho video: Keep Nam as the single recognizable main character: charcoal gray stick-figure body #6A6A6A, round head 15% larger than normal, large expressive white eyes, no hair, no nose, no ears, a simple curved mouth, and a small white crack on the left side of his head. His outfit stays consistent: navy hoodie, black shorts, white sneakers, and a yellow scarf. After entering the house, he may become wet, dusty, and dirty, but his design must not change. The house is an old wooden home on the edge of town with a leaking roof, cracked walls, creaking floors, a crooked door, and realistic dusty objects. The visual style is high-quality cinematic 3D animation with natural light, volumetric rain, fog, dust, and smooth moving camera language: dolly, handheld, orbit, crane. No on-screen text, no logo, no watermark. The episode ends in the same house after Nam creates one warm corner of safety and discovers a mysterious wooden box."
                        - generic:
                          - paragraph: Kịch bản chi tiết
                          - paragraph: Bản đọc duyệt bằng tiếng Việt, kèm nội dung sản xuất theo Tiếng Việt nếu khác.
                          - generic: "Bản tiếng Việt: Segment 1 mở bằng căn nhà tồi tàn trong mưa, cửa đập mạnh, Nam đứng bên ngoài vừa sợ vừa tò mò. Voiceover tiếng Anh đặt hook: “Most people would run from this house. Nam walked closer.” Segment 2 Nam bước vào, bị cửa kẹt làm giật mình, rồi thấy nước mưa nhỏ xuống khắp nơi. Segment 3 cậu cố sửa tạm mái dột nhưng sàn gỗ lún xuống, tạo một khoảnh khắc hài hước và nguy hiểm. Segment 4 Nam gần như bỏ cuộc khi thấy căn nhà quá hỏng, nhưng một bức ảnh cũ khiến cậu nhận ra từng có người yêu quý nơi này. Segment 5 cậu dọn bụi, kê lại bàn, vá tạm lỗ hổng và phát hiện một hộp gỗ giấu dưới tấm ván. Segment 6 Nam thắp ánh đèn đầu tiên trong nhà, mỉm cười mệt mỏi, rồi nghe tiếng động nhỏ từ chiếc hộp. Tập kết bằng cảm giác hy vọng xen bí ẩn, mở đường cho tập tiếp theo. Bản tiếng Anh dùng cho video: Segment 1 opens on a ruined house in the rain. The door slams in the wind as Nam stands outside, scared but curious. The English voiceover hooks the viewer: “Most people would run from this house. Nam walked closer.” In Segment 2, Nam steps inside, gets startled by the stuck door, and notices rain leaking everywhere. In Segment 3, he tries a quick roof repair, but the wooden floor sinks under him, turning danger into a small comedic beat. In Segment 4, Nam almost gives up, until an old photograph suggests this broken house once mattered to someone. In Segment 5, he clears dust, fixes one corner, and discovers a hidden wooden box under a loose floorboard. In Segment 6, Nam lights the first warm lamp, smiles through exhaustion, and hears a tiny sound from the box. The episode ends with hope and mystery, setting up the next chapter."
