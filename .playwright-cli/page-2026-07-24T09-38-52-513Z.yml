                          - paragraph: Segment 6 là payoff và cliffhanger mềm. Nam bật chiếc đèn cũ, ánh sáng vàng lan qua góc phòng đã được dọn, tạo cảm giác an toàn đầu tiên trong căn nhà tồi tàn. Cậu ngồi cạnh hộp gỗ chưa mở, mỉm cười mệt nhưng nhẹ nhõm. Cuối cùng hộp rung nhẹ và phát ra âm thanh nhỏ, khiến Nam quay sang kinh ngạc. Voiceover tiếng Anh khép lại nhu cầu trú ẩn nhưng mở bí ẩn cho tập sau. Retention vừa giải quyết cảm xúc vừa giữ open loop về chiếc hộp. Chuyển cảnh là final hold, không cắt đột ngột. Âm thanh gồm click đèn, hum nhẹ, mưa nhỏ, tiếng hộp gỗ tick và một mystery sting rất nhỏ.
                          - paragraph: Giữ chân, chuyển cảnh và âm thanh/SFX vẫn nằm trong câu lệnh gốc tiếng Anh để gửi công cụ video. Bản tiếng Việt phía trên là phần để bạn duyệt nội dung.
