                  - paragraph [ref=e1195]: "Segment 5 cho thấy Nam đổi chiến lược: không sửa cả căn nhà mà dọn một góc trước. Cậu quét bụi, dựng bàn, đặt xô dưới chỗ dột, chỉnh khăn vàng và tự giơ ngón cái. Sau đó cậu gõ sàn, nghe âm rỗng, cạy tấm ván và phát hiện hộp gỗ nhỏ vẫn đóng kín. Voiceover tiếng Anh nhấn vào bài học nhỏ: sửa một góc trước. Retention vừa thưởng cho tiến bộ của Nam vừa mở bí ẩn mới: trong hộp có gì. Chuyển cảnh object match cut khi hộp được nhấc lên. Âm thanh dùng nhịp broom, xô, bàn, tiếng gõ rỗng và cue bí ẩn nhỏ, không làm lấn voiceover."
