                  - paragraph [ref=e1153]: Segment 2 nối trực tiếp từ cảnh Nam bước qua cửa. Camera handheld theo sau cậu vào căn nhà tối, cửa đóng sầm khiến cậu giật bắn rồi căn phòng lộ ra như đang mưa bên trong. Nam đặt xô hứng nước và né các dòng dột, cuối segment nhìn thấy tấm ván lỏng để mở sang ý tưởng sửa nhà. Voiceover tiếng Anh giữ nhịp vừa đủ, không tạo thoại nhân vật. Retention chuyển nỗi sợ thành hài hình thể và cho thấy căn nhà gần như không thể ở được. Chuyển cảnh là action cut khi tay Nam vươn tới tấm ván. Âm thanh gồm cửa đập, nước nhỏ, xô kêu, sneaker rít nhẹ, gỗ cót két và nhạc tò mò căng vừa.
